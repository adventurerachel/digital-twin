name: Deploy to Hugging Face Spaces

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Cache HF repo
        uses: actions/cache@v4
        with:
          path: repo
          key: hf-space-repo

      - name: Debug structure
        run: |
          echo "Listing repo contents:"
          ls -R

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -e

          git config --global user.email "you@example.com"
          git config --global user.name "github-actions"

          git clone https://huggingface.co/spaces/datarachel/digitaltwin repo

          rsync -av ./app/ repo
  
          cd repo
          git add .
          git commit -m "Auto deploy from GitHub" || echo "No changes"
          git push https://YOUR_USERNAME:$HF_TOKEN@huggingface.co/spaces/datarachel/digitaltwin main
